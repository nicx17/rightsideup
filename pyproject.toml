[project]
name = "autorotate"
version = "0.1.0"
description = "Batch auto-rotate images using local visual analysis."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.5.4",
    "onnxruntime",
    "opencv-python",
    "pillow>=13.0.0",
    "typer",
    "rich",
]

[project.scripts]
autorotate = "autorotate.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.3",
]
